<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civic Chat</title>
<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
    background:#ffffff;
}
#chat{
    height:420px;
    border:1px solid #dcdcdc;
    border-radius:12px;
    padding:12px;
    overflow-y:auto;
    background:#fafafa;
    margin-bottom:12px;
}
.msg{
    margin:10px 0;
    padding:10px 12px;
    border-radius:10px;
    max-width:75%;
    line-height:1.45;
    word-break:break-word;
}

.user{
    background:#dbeafe;
    color:#111;
    margin-left:auto;
    text-align:right;
}

.row{
    display:flex;
    gap:8px;
}

#input{
    flex:1;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#sendBtn{
    background:#2563eb;
    color:white;
}
#sendBtn:disabled,
#input:disabled{
    opacity:.6;
    cursor:not-allowed;
}
.bot{
    background:#f1f1f1;
    color:#222;
    max-width:95%;
}

.bot p{
    margin:6px 0;
    line-height:1.4;
}

.bot table{
    width:100%;
    border-collapse:collapse;
    margin:10px 0;
    font-size:14px;
}

.bot .summary{
    margin:10px 0;
    font-size:inherit;
    line-height:inherit;
    color:#222;
}

.bot .reflection{
    margin-top:10px;
}
.bot{
    background:#f1f1f1;
    color:#222;
    max-width:95%;
    font-size:15px;
    line-height:1.4;
}
  
.bot th,
.bot td{
    border:1px solid #d9d9d9;
    padding:6px 8px;
}

.bot th{
    background:#f5f5f5;
    font-weight:600;
    text-align:left;
}
    
.bot th:nth-child(2),
.bot th:nth-child(3),
.bot td:nth-child(2),
.bot td:nth-child(3){
    text-align:center;
}
</style>

</head>

<body>

<div id="chat"></div>

<div class="row">

<input
id="input"
type="text"
placeholder="Type your message...">

<button id="sendBtn">
Send
</button>

</div>

<script>

// ----------------------------------------------------
// Participant information passed from Qualtrics
// ----------------------------------------------------

const params = new URLSearchParams(window.location.search);
const participantId = params.get("pid");
const party = params.get("party");
const inparty = params.get("inparty");
const outparty = params.get("outparty");
const guessPoll = Number(params.get("guess_poll"));
const guessCourt = Number(params.get("guess_court"));
const guessAssault = Number(params.get("guess_assault"));
const reasoning = params.get("reasoning");

// ----------------------------------------------------
// Conversation state
// ----------------------------------------------------

const history = [];
let messageCount = 0;
const MAX_USER_MESSAGES = 3;
let isWaiting = false;
let chatFinished = false;

// ----------------------------------------------------
// UI helpers
// ----------------------------------------------------
function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "bot") {
        div.innerHTML = text;
    } else {
        div.textContent = text;
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function lockChat(){
    input.disabled=true;
    sendBtn.disabled=true;

}
function unlockChat(){
    if(chatFinished)return;
    input.disabled=false;
    sendBtn.disabled=false;
    input.focus();
}
  // ----------------------------------------------------
// Notify Qualtrics when conversation finishes
// ----------------------------------------------------
function notifyQualtricsChatComplete(){
    try{
        window.parent.postMessage(
            {
                type:"chatComplete",
                participantId,
                party,
                inparty,
                outparty,
                guessPoll,
                guessCourt,
                guessAssault,
                reasoning,
                history
            },
            "*"
        );
    }
    catch(e){
        console.error("postMessage error:",e);
    }
}
// ----------------------------------------------------
// Finish chat
// ----------------------------------------------------
function finishChat(){
    if(chatFinished) return;
    chatFinished=true;
    lockChat();
    notifyQualtricsChatComplete();
}
// ----------------------------------------------------
// Load opening message
// ----------------------------------------------------
async function loadFirstMessage(){
    isWaiting=true;
    lockChat();
    try{
        const response = await fetch(
            "/api/claude_us",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    firstTurn:true,
                    participantId,
                    party,
                    inparty,
                    outparty,
                    guessPoll,
                    guessCourt,
                    guessAssault,
                    reasoning,
                    history
                })
            }
        );
        
        const data = await response.json();

        const reply =
            data.reply ||
            "I'm sorry, I couldn't generate a response.";
        addMessage("bot",reply);
        history.push({
            role:"assistant",
            content:reply
        });
        unlockChat();
    }

    catch(error){
        console.error(error);
        addMessage(
            "bot",
            "Connection error. Please refresh the page and try again."
        );
    }
    finally{
        isWaiting=false;
    }
}
  // ----------------------------------------------------
// Send participant message
// ----------------------------------------------------
async function sendMessage() {
    if (isWaiting || chatFinished) return;
    const text = input.value.trim();
    if (!text) return;
    addMessage("user", text);

    history.push({
        role: "user",
        content: text
    });
    input.value = "";
    messageCount++;
    isWaiting = true;
    lockChat();
    try {
        const response = await fetch("/api/claude_us", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                firstTurn: false,
                participantId,
                party,
                inparty,
                outparty,
                guessPoll,
                guessCourt,
                guessAssault,
                reasoning,
                history
            })
        });

        const data = await response.json();
        const reply =
            data.reply ||
            "I'm sorry, I couldn't generate a response.";
        addMessage("bot", reply);
        history.push({
            role: "assistant",
            content: reply
        });

        if (messageCount >= MAX_USER_MESSAGES) {
            finishChat();
        } else {
            unlockChat();
        }
    } catch (error) {
        console.error(error);
        addMessage(
            "bot",
            "Connection error. Please try again."
        );
        unlockChat();
    } finally {
        isWaiting = false;
    }
}
    
// ----------------------------------------------------
// Initialize chat
// ----------------------------------------------------
document.addEventListener("DOMContentLoaded", () => {
    loadFirstMessage();
    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }
    });
});
</script>

</body>
</html>
